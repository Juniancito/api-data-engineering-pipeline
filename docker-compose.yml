
services:
  postgres:
    image: postgres:16
    container_name: data-engineering-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_engineering
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_engineering"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
